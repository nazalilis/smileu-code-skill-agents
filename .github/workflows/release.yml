name: Release & Publish Package

# This workflow never commits to the repository and never opens pull requests.
# The version bump is always a commit you make yourself (for example with
# "npm run release:minor"). The workflow only tags, publishes the package and
# creates the GitHub Release.
#
# It releases when:
# 1. a push to main changes the version in package.json to one without a tag, or
# 2. a vX.Y.Z tag is pushed (for example with "git push origin main --follow-tags").
#
# "Run workflow" in the Actions tab releases the version already in package.json.
# Use it to retry a release that failed after its tag was created; tick "dry run"
# to only see the plan.
#
# Published to:
# - GitHub Packages as @nazalilis/smileu-code-skill-agents (always; the name matches
#   this repository, because GITHUB_TOKEN may only publish packages linked to it), and
# - the public npm registry as smileu-code-skill when the NPM_TOKEN secret is set,
#   so users can run "npx smileu-code-skill". Override the npm name with the
#   NPM_PACKAGE_NAME repository variable.
#
# Re-running is safe: an existing tag on the same commit is reused, a version that
# is already on a registry is skipped, and an existing GitHub Release is updated.
#
# Actions are pinned to full commit SHAs; the comment names the release.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    # Path filters apply to branch pushes only; tag pushes always run.
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and test only. Nothing is tagged or published.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One group per commit: the branch run and the tag run for the same commit are
# serialised, while a later push can never cancel a release that is queued.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      should_release: ${{ steps.plan.outputs.should_release }}
      needs_tag: ${{ steps.plan.outputs.needs_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20

      - name: Decide what to release
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          CURRENT="$(node -p "require('./package.json').version")"
          if ! [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version is not a valid semantic version."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not on main. Releases are cut from main only."
            exit 1
          fi

          NEEDS_TAG=false
          SHOULD_RELEASE=true
          SKIP_REASON=""

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$CURRENT" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $CURRENT."
              exit 1
            fi
          else
            VERSION="$CURRENT"
            TAG_SHA="$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)"

            # On a push, release only when this push actually changed the version.
            # Editing scripts or dependencies in package.json must not publish.
            PREVIOUS=""
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              PREVIOUS="$(git show "$BEFORE_SHA:package.json" 2> /dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf-8')).version" 2> /dev/null || true)"
            fi

            if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                echo "::error::v$VERSION is already tagged on a different commit ($TAG_SHA)."
                exit 1
              fi
              SHOULD_RELEASE=false
              SKIP_REASON="v$VERSION is already tagged on a different commit."
            elif [ -n "$TAG_SHA" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
              SHOULD_RELEASE=false
              SKIP_REASON="v$VERSION is tagged on this commit; the run for the tag push releases it."
            elif [ -n "$TAG_SHA" ]; then
              # Manual retry of a release whose tag already exists on this commit.
              NEEDS_TAG=false
            elif [ -n "$PREVIOUS" ] && [ "$PREVIOUS" = "$VERSION" ]; then
              SHOULD_RELEASE=false
              SKIP_REASON="package.json changed, but the version is still $VERSION."
            else
              NEEDS_TAG=true
            fi
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then PRERELEASE=true; else PRERELEASE=false; fi

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "should_release=$SHOULD_RELEASE"
            echo "needs_tag=$NEEDS_TAG"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`$GITHUB_EVENT_NAME\` on \`$GITHUB_REF_NAME\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Pre-release | $PRERELEASE |"
            echo "| Will release | $SHOULD_RELEASE |"
            echo "| Create tag | $NEEDS_TAG |"
            if [ -n "$SKIP_REASON" ]; then echo ""; echo "Nothing to release: $SKIP_REASON"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$SKIP_REASON" ]; then echo "Nothing to release: $SKIP_REASON"; fi

  test:
    name: Test before release
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    name: Release ${{ needs.plan.outputs.tag }}
    needs: [plan, test]
    if: needs.plan.outputs.should_release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      PACKAGE_NAME: '@nazalilis/smileu-code-skill-agents'
      NPM_PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME || 'smileu-code-skill' }}
      # Only whether the secret exists is shared with every step. The token itself
      # is mapped into the environment of the npm publish step alone.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # No git credentials stay behind for later steps; the tag is created
          # through the API with a token scoped to that one step.
          persist-credentials: false

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nazalilis'

      - name: Tag the released commit
        if: needs.plan.outputs.needs_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [ -z "$EXISTING" ]; then
            EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2> /dev/null || true)"
          fi
          if [ "$EXISTING" = "$GITHUB_SHA" ]; then
            echo "$TAG already points at this commit."
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            echo "::error::$TAG already exists on a different commit ($EXISTING)."
            exit 1
          fi
          # A lightweight tag created through the API carries no tagger identity.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          echo "Created tag $TAG at $GITHUB_SHA."

      - name: Publish to GitHub Packages
        id: github_packages
        # A problem on one registry must not stop the other from being published.
        # The last step fails the job when either publish failed.
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if npm view "$PACKAGE_NAME@$VERSION" version --registry https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already on GitHub Packages. Skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DIST_TAG=latest
          if [ "$PRERELEASE" = "true" ]; then DIST_TAG=next; fi
          npm publish --tag "$DIST_TAG"
          echo "Published $PACKAGE_NAME@$VERSION to GitHub Packages (dist-tag: $DIST_TAG)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to the npm registry
        id: npm_registry
        if: env.HAS_NPM_TOKEN == 'true'
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NPMJS=https://registry.npmjs.org
          if npm view "$NPM_PACKAGE_NAME@$VERSION" version --registry "$NPMJS" > /dev/null 2>&1; then
            echo "$NPM_PACKAGE_NAME@$VERSION is already on npm. Skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # setup-node's .npmrc does not end with a newline, so start a new line
          # first. The single quotes keep ${NPM_TOKEN} literal: npm expands it when
          # it reads the file, so the token itself is never written to disk.
          printf '\n%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> "$NPM_CONFIG_USERCONFIG"
          # GitHub Packages needs the scoped name and its registry in package.json.
          # On npm the package goes out under an unscoped name so that
          # "npx smileu-code-skill" works. These edits exist only in this CI
          # checkout and are never committed.
          npm pkg set "name=$NPM_PACKAGE_NAME"
          npm pkg delete publishConfig
          DIST_TAG=latest
          if [ "$PRERELEASE" = "true" ]; then DIST_TAG=next; fi
          npm publish --access public --tag "$DIST_TAG" --registry "$NPMJS"
          echo "Published $NPM_PACKAGE_NAME@$VERSION to npm (dist-tag: $DIST_TAG). Run it with: npx $NPM_PACKAGE_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Note when npm publishing is not configured
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "NPM_TOKEN is not set, so $NPM_PACKAGE_NAME was not published to npm and 'npx $NPM_PACKAGE_NAME' will not work yet." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare release notes
        env:
          NPM_OUTCOME: ${{ steps.npm_registry.outcome }}
          GITHUB_PACKAGES_OUTCOME: ${{ steps.github_packages.outcome }}
        run: |
          if ! node scripts/release-notes.js "$VERSION" > RELEASE_NOTES.md; then
            : > RELEASE_NOTES.md
          fi
          # Only point people at a registry the package was actually published to.
          if [ "$NPM_OUTCOME" = "success" ]; then
            printf '\n### Install\n\n```bash\nnpx %s@%s init\n```\n' "$NPM_PACKAGE_NAME" "$VERSION" >> RELEASE_NOTES.md
          elif [ "$GITHUB_PACKAGES_OUTCOME" = "success" ]; then
            printf '\n### Install\n\n```bash\nnpm install -g %s@%s\n```\n\nInstalling from GitHub Packages requires logging in to npm.pkg.github.com first.\n' "$PACKAGE_NAME" "$VERSION" >> RELEASE_NOTES.md
          fi

      - name: Create or update GitHub Release
        # Only announce a release that can actually be installed from somewhere.
        if: steps.npm_registry.outcome == 'success' || steps.github_packages.outcome == 'success'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Smileu Code Skill ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          # Commit-level notes are appended to the changelog section, or used on
          # their own when the changelog has no section for this version.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail the release when a publish failed
        if: steps.github_packages.outcome == 'failure' || steps.npm_registry.outcome == 'failure'
        env:
          NPM_OUTCOME: ${{ steps.npm_registry.outcome }}
          GITHUB_PACKAGES_OUTCOME: ${{ steps.github_packages.outcome }}
        run: |
          echo "::error::Publishing did not fully succeed (GitHub Packages: $GITHUB_PACKAGES_OUTCOME, npm: $NPM_OUTCOME). Fix the cause and re-run this job; versions that were already published are skipped."
          exit 1
