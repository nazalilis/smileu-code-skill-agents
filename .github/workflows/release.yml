name: Release & Publish Package

# This workflow never commits to the repository and never opens pull requests.
# The version bump is always a commit you make yourself (for example with
# "npm run release:minor"). The workflow only tags, creates the GitHub Release
# and publishes the package.
#
# It releases when:
# 1. a push to main changes the version in package.json to one without a tag, or
# 2. a vX.Y.Z tag is pushed.
#
# "Run workflow" in the Actions tab releases the version already in package.json,
# which is useful to retry a failed release. Tick "dry run" to only see the plan.
#
# Re-running is safe: an existing GitHub Release is updated in place, and a
# version that is already on the registry is skipped instead of failing.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    # Path filters apply to branch pushes only; tag pushes always run.
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and test only. Nothing is tagged or published.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      should_release: ${{ steps.plan.outputs.should_release }}
      needs_tag: ${{ steps.plan.outputs.needs_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide what to release
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          CURRENT="$(node -p "require('./package.json').version")"
          NEEDS_TAG=false
          SHOULD_RELEASE=true
          SKIP_REASON=""

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$CURRENT" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $CURRENT."
              exit 1
            fi
          else
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Releases run from main only; this run is on $GITHUB_REF."
              exit 1
            fi

            VERSION="$CURRENT"
            # On a push, release only when this push actually changed the version.
            # Editing scripts or dependencies in package.json must not publish.
            PREVIOUS=""
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              PREVIOUS="$(git show "$BEFORE_SHA:package.json" 2> /dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf-8')).version" 2> /dev/null || true)"
            fi

            if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
              SHOULD_RELEASE=false
              SKIP_REASON="v$VERSION is already tagged."
            elif [ -n "$PREVIOUS" ] && [ "$PREVIOUS" = "$VERSION" ]; then
              SHOULD_RELEASE=false
              SKIP_REASON="package.json changed, but the version is still $VERSION."
            else
              NEEDS_TAG=true
            fi
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then PRERELEASE=true; else PRERELEASE=false; fi

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "should_release=$SHOULD_RELEASE"
            echo "needs_tag=$NEEDS_TAG"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`$GITHUB_EVENT_NAME\` on \`$GITHUB_REF_NAME\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Pre-release | $PRERELEASE |"
            echo "| Will release | $SHOULD_RELEASE |"
            echo "| Create tag | $NEEDS_TAG |"
            if [ -n "$SKIP_REASON" ]; then echo ""; echo "Nothing to release: $SKIP_REASON"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$SKIP_REASON" ]; then echo "Nothing to release: $SKIP_REASON"; fi

  test:
    name: Test before release
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    name: Release ${{ needs.plan.outputs.tag }}
    needs: [plan, test]
    if: needs.plan.outputs.should_release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      PACKAGE_NAME: '@nazalilis/smileu-code-skill'
      # Secrets are not available in step-level `if:` expressions. Mapping the
      # secret into env here is what makes `if: env.NPM_TOKEN != ''` work below.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nazalilis'

      - name: Tag the released commit
        if: needs.plan.outputs.needs_tag == 'true'
        run: |
          set -euo pipefail
          # A lightweight tag carries no tagger identity, so no bot name is
          # recorded in the repository history.
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Prepare release notes
        run: |
          if ! node scripts/release-notes.js "$VERSION" > RELEASE_NOTES.md; then
            : > RELEASE_NOTES.md
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Smileu Code Skill ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          # Commit-level notes are appended to the changelog section, or used on
          # their own when the changelog has no section for this version.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if npm view "$PACKAGE_NAME@$VERSION" version --registry https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already on GitHub Packages. Skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DIST_TAG=latest
          if [ "$PRERELEASE" = "true" ]; then DIST_TAG=next; fi
          npm publish --tag "$DIST_TAG"
          echo "Published $PACKAGE_NAME@$VERSION to GitHub Packages (dist-tag: $DIST_TAG)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to the npm registry (optional)
        if: env.NPM_TOKEN != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          NPMJS=https://registry.npmjs.org
          if npm view "$PACKAGE_NAME@$VERSION" version --registry "$NPMJS" > /dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already on npm. Skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
          # publishConfig and the project .npmrc both pin the scope to GitHub
          # Packages. Override them for this one publish; the change is never committed.
          npm pkg delete publishConfig.registry
          DIST_TAG=latest
          if [ "$PRERELEASE" = "true" ]; then DIST_TAG=next; fi
          npm publish --access public --tag "$DIST_TAG" --registry "$NPMJS" "--@nazalilis:registry=$NPMJS"
          echo "Published $PACKAGE_NAME@$VERSION to npm (dist-tag: $DIST_TAG)." | tee -a "$GITHUB_STEP_SUMMARY"
